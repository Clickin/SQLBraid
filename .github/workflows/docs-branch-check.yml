name: Documentation branch check

on:
  push:
    branches:
      - docs/agent-skill-llms

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Refresh translated-page source digest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("website/translation-registry.json")
          text = path.read_text()
          old = '"sourceDigest": "c9a49780764ec5d09a19c3906769461ae964956ba621c1fcdf5bb6bc2fae8e37"'
          new = '"sourceDigest": "d275d5adb9ab55e74be6a092aad73bb1525903bbcdcf70ea6fcc1c6a02f650f2"'
          if new not in text:
              if old not in text:
                  raise SystemExit("agents/skill.md translation registry entry was not found")
              path.write_text(text.replace(old, new, 1))
          PY
          if ! git diff --quiet -- website/translation-registry.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add website/translation-registry.json
            git commit -m "docs: refresh Korean skill translation digest"
            git push origin HEAD:docs/agent-skill-llms
          fi
      - name: Set up Node 22.18.0
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0
      - name: Set up repository-pinned pnpm
        uses: pnpm/action-setup@v6.1.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages required by docs
        run: pnpm run build
      - name: Build documentation
        run: pnpm run docs:build

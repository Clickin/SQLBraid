name: Format debug

on:
  push:
    branches:
      - release/independent-package-versioning

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Show canonical format diff
        shell: bash
        run: |
          pnpm run fmt
          git diff -- tests/release-workflows.test.ts tests/release.test.ts tests/scripts/validate-packages.mjs

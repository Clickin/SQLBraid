name: Documentation site

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "website/**"
      - "support/**"
      - "scripts/validate-support.mjs"
      - "scripts/validate-translations.mjs"
      - "scripts/docs-history.mjs"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish documentation after validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare docs-history worktree
        env:
          HISTORY_DIR: ${{ runner.temp }}/sqlbraid-docs-history
        run: |
          rm -rf "$HISTORY_DIR"
          history_ref="$(git ls-remote --heads origin refs/heads/docs-history)"
          if [[ -n "$history_ref" ]]; then
            git fetch origin refs/heads/docs-history
            git worktree add --detach "$HISTORY_DIR" FETCH_HEAD
          else
            git worktree add --detach "$HISTORY_DIR" HEAD
            git -C "$HISTORY_DIR" rm -rf .
          fi

      - name: Set up Node 22.18.0
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0

      - name: Set up repository-pinned pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Build compiler and Vite plugin dependencies
        run: pnpm run build

      - name: Select documentation build context
        env:
          HISTORY_DIR: ${{ runner.temp }}/sqlbraid-docs-history
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "SQLBRAID_DOCS_CHANNEL=release" >> "$GITHUB_ENV"
            echo "SQLBRAID_DOCS_VERSION=$version" >> "$GITHUB_ENV"
            echo "SQLBRAID_DOCS_BASE=/SQLBraid/v/$version" >> "$GITHUB_ENV"
            node scripts/docs-history.mjs assert-source \
              --root "$GITHUB_WORKSPACE" \
              --version "$version" \
              --commit "$GITHUB_SHA" \
              --ref "$GITHUB_REF"
          else
            echo "SQLBRAID_DOCS_CHANNEL=dev" >> "$GITHUB_ENV"
            echo "SQLBRAID_DOCS_BASE=/SQLBraid/dev" >> "$GITHUB_ENV"
          fi
          echo "SQLBRAID_DOCS_VERSIONS=$(node scripts/docs-history.mjs versions --history "$HISTORY_DIR")" >> "$GITHUB_ENV"

      - name: Build Astro Starlight site
        run: pnpm run docs:build

      - name: Update immutable documentation history
        env:
          HISTORY_DIR: ${{ runner.temp }}/sqlbraid-docs-history
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            node scripts/docs-history.mjs archive \
              --root "$GITHUB_WORKSPACE" \
              --history "$HISTORY_DIR" \
              --source "$GITHUB_WORKSPACE/website/dist" \
              --version "$SQLBRAID_DOCS_VERSION" \
              --commit "$GITHUB_SHA" \
              --ref "$GITHUB_REF"
          else
            node scripts/docs-history.mjs sync-dev \
              --history "$HISTORY_DIR" \
              --source "$GITHUB_WORKSPACE/website/dist"
          fi

      - name: Assemble persistent Pages artifact
        env:
          HISTORY_DIR: ${{ runner.temp }}/sqlbraid-docs-history
        run: |
          node scripts/docs-history.mjs stage \
            --history "$HISTORY_DIR" \
            --output "$GITHUB_WORKSPACE/website/deploy" \
            --public-root /SQLBraid

      - name: Preserve staged Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docs-pages-deploy
          path: website/deploy
          if-no-files-found: error
          retention-days: 1

      - name: Preserve generated docs history
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        run: tar --exclude='./.git' -czf "$RUNNER_TEMP/docs-history.tar.gz" -C "$RUNNER_TEMP/sqlbraid-docs-history" .

      - name: Upload generated docs history
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docs-history
          path: ${{ runner.temp }}/docs-history.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish-history:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.1
        with:
          name: docs-history
          path: ${{ runner.temp }}/docs-history-artifact
      - name: Prepare docs-history worktree
        env:
          HISTORY_DIR: ${{ runner.temp }}/sqlbraid-docs-history
        run: |
          rm -rf "$HISTORY_DIR"
          history_ref="$(git ls-remote --heads origin refs/heads/docs-history)"
          if [[ -n "$history_ref" ]]; then
            git fetch origin refs/heads/docs-history
            git worktree add --detach "$HISTORY_DIR" FETCH_HEAD
            git -C "$HISTORY_DIR" rm -rf .
          else
            git worktree add --detach "$HISTORY_DIR" HEAD
            git -C "$HISTORY_DIR" rm -rf .
          fi
          tar -xzf "$RUNNER_TEMP/docs-history-artifact/docs-history.tar.gz" -C "$HISTORY_DIR"
      - name: Preserve docs-history branch
        env:
          HISTORY_DIR: ${{ runner.temp }}/sqlbraid-docs-history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$HISTORY_DIR" add --all
          if ! git -C "$HISTORY_DIR" diff --cached --quiet; then
            git -C "$HISTORY_DIR" commit -m "docs: update generated history"
            git -C "$HISTORY_DIR" push origin HEAD:refs/heads/docs-history
          fi

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: [build, publish-history]
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: docs-pages-deploy
          path: website/deploy
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: website/deploy
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1

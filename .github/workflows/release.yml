name: Release

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: "certify: non-mutating full validation; stage: OIDC staged publication; pack-only: no publication rehearsal"
        required: true
        default: certify
        type: choice
        options:
          - certify
          - pack-only
          - stage
      prior_run_id:
        description: "Optional prior Release run ID whose staged-publication evidence is being reconciled; leave empty for fresh staging"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  SQLBRAID_RELEASE_MODE: ${{ inputs.release_mode || 'certify' }}
  SQLBRAID_TAG_BEFORE: ${{ github.event.before || '' }}
  NODE_VERSION: 22.18.0
  NODE_COMPAT_VERSION: 24.21.0
  BUN_VERSION: 1.3.14
  DENO_VERSION: 2.9.3
  RELEASE_DEFAULT_EVIDENCE_SHARDS: postgres,mysql,mariadb,sqlite,oracle,mssql,web,bun-sql

jobs:
  release-prep:
    name: Prepare immutable npm release candidate
    outputs:
      compatibility_matrix: ${{ steps.compatibility-matrix.outputs.matrix }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact release ref
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check formatting and lint
        run: pnpm run fmt:check && pnpm run lint
      - name: Validate prior candidate run ID
        if: inputs.release_mode == 'stage' && inputs.prior_run_id != ''
        env:
          PRIOR_RUN_ID: ${{ inputs.prior_run_id }}
        shell: bash
        run: |
          [[ "$PRIOR_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "prior_run_id must be numeric."
            exit 1
          }
      - name: Download prior validated candidate
        if: inputs.release_mode == 'stage' && inputs.prior_run_id != ''
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-candidate-validated
          path: ${{ runner.temp }}/prior-validated
          run-id: ${{ inputs.prior_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download prior prepared candidate
        if: inputs.release_mode == 'stage' && inputs.prior_run_id != ''
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prior-prepared
          run-id: ${{ inputs.prior_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Determine release version
        shell: bash
        run: |
          manifest_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "$GITHUB_EVENT_NAME" == "push" || ( "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$SQLBRAID_RELEASE_MODE" == "stage" ) ]]; then
            [[ "$GITHUB_REF_TYPE" == "tag" ]] || {
              echo "Release staging requires an exact version tag ref."
              exit 1
            }
            tag_version="${GITHUB_REF_NAME#v}"
            [[ "$GITHUB_REF_NAME" == v* && "$tag_version" == "$manifest_version" ]] || {
              echo "Release tag and package version must match."
              exit 1
            }
            echo "SQLBRAID_RELEASE_VERSION=$tag_version" >> "$GITHUB_ENV"
          else
            echo "SQLBRAID_RELEASE_VERSION=$manifest_version" >> "$GITHUB_ENV"
          fi
      - name: Assert clean tree and exact ref
        run: node scripts/release.mjs --mode preflight
      - name: Validate support and translations
        run: pnpm run support:validate && pnpm run docs:translations
      - name: Typecheck packages
        run: pnpm run typecheck:packages
      - name: Build packages once
        if: inputs.release_mode != 'stage' || inputs.prior_run_id == ''
        run: pnpm run build:packages
      - name: Pack immutable release candidate
        if: inputs.release_mode != 'stage' || inputs.prior_run_id == ''
        env:
          SQLBRAID_RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/sqlbraid-release-artifacts
        run: node scripts/release.mjs --mode pack --artifact-dir "$SQLBRAID_RELEASE_ARTIFACT_DIR"
      - name: Restore prior validated candidate
        if: inputs.release_mode == 'stage' && inputs.prior_run_id != ''
        run: tar -xzf "$RUNNER_TEMP/prior-validated/release-candidate-validated.tar.gz" -C "$RUNNER_TEMP"
      - name: Restore prior prepared build and candidate archive
        if: inputs.release_mode == 'stage' && inputs.prior_run_id != ''
        run: |
          cp "$RUNNER_TEMP/prior-prepared/release-candidate.tar.gz" "$RUNNER_TEMP/release-candidate.tar.gz"
          cp "$RUNNER_TEMP/prior-prepared/prepared-build.tar.gz" "$RUNNER_TEMP/prepared-build.tar.gz"
      - name: Archive candidate and prepared build
        if: inputs.release_mode != 'stage' || inputs.prior_run_id == ''
        run: |
          tar -czf "$RUNNER_TEMP/release-candidate.tar.gz" -C "$RUNNER_TEMP" sqlbraid-release-artifacts
          tar -czf "$RUNNER_TEMP/prepared-build.tar.gz" -C "$GITHUB_WORKSPACE" packages/*/dist
      - name: Verify and export certification candidate identity
        env:
          SQLBRAID_CERT_SOURCE_SHA: ${{ github.sha }}
          SQLBRAID_CERT_EXPECTED_RUN_ID: ${{ inputs.release_mode == 'stage' && inputs.prior_run_id != '' && inputs.prior_run_id || github.run_id }}
          SQLBRAID_CERT_EXPECTED_CANDIDATE: ${{ inputs.release_mode == 'stage' && inputs.prior_run_id != '' && format('{0}/prior-prepared/candidate.json', runner.temp) || '' }}
        run: |
          args=(node scripts/certification.mjs --verify-candidate --source-sha "$GITHUB_SHA" --candidate-dir "$RUNNER_TEMP" --output "$RUNNER_TEMP/candidate.json")
          if [[ -n "$SQLBRAID_CERT_EXPECTED_CANDIDATE" ]]; then
            args+=(--expected-candidate "$SQLBRAID_CERT_EXPECTED_CANDIDATE")
          fi
          "${args[@]}"
      - name: Export exact compatibility matrix
        id: compatibility-matrix
        run: |
          node -e 'const fs=require("node:fs"); const manifest=JSON.parse(fs.readFileSync("support/runtime-compatibility.json","utf8")); process.stdout.write(`matrix=${JSON.stringify(manifest.cells.filter(({releaseBlocking})=>releaseBlocking).map(({id,runtime,driver})=>({id,node:runtime.version,driver:driver?.package??null,driver_version:driver?.version??null})))}\n`);' >> "$GITHUB_OUTPUT"
      - name: Preserve release preparation
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-prepared
          path: |
            ${{ runner.temp }}/release-candidate.tar.gz
            ${{ runner.temp }}/prepared-build.tar.gz
            ${{ runner.temp }}/candidate.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-certification-candidate
          path: ${{ runner.temp }}/candidate.json
          if-no-files-found: error
          retention-days: 90

  release-common:
    needs: release-prep
    name: Node 22 common, CLI and native-boundary contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared
      - name: Restore prepared build
        run: tar -xzf "$RUNNER_TEMP/prepared/prepared-build.tar.gz" -C "$GITHUB_WORKSPACE"
      - name: Run Node 22 common tests
        run: |
          mkdir -p "$RUNNER_TEMP/semantic-boundary"
          pnpm exec vitest run --project unit --project cli --maxWorkers=2 \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/semantic-boundary/results.json"
          node scripts/validate-contract-matrix.mjs --record-report "$RUNNER_TEMP/semantic-boundary/results.json" \
            --source-sha "$GITHUB_SHA" --layer boundary --targets all
      - name: Preserve native-boundary contract evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-semantic-boundary
          path: ${{ runner.temp }}/semantic-boundary
          if-no-files-found: error
          retention-days: 14

  release-db:
    needs: release-prep
    name: Node 22 ${{ matrix.id }} database tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: postgres
            project: db-postgres
            semantic_targets: postgres-pg-node-16-4
            postgres_target: postgres
            evidence_target: ""
            evidence_env: "{}"
          - id: postgres-current
            project: db-postgres
            semantic_targets: postgres-current
            postgres_target: postgres-current
            evidence_target: postgres-current
            evidence_env: '{"SQLBRAID_POSTGRES_TARGET":"postgres-current"}'
          - id: mysql
            project: db-mysql
            semantic_targets: mysql-mysql2-node-8-4-2
            evidence_target: ""
            evidence_env: "{}"
          - id: mariadb
            project: db-mariadb
            semantic_targets: mariadb-connector-node-11-8-9
            evidence_target: ""
            evidence_env: "{}"
          - id: sqlite
            project: db-sqlite
            semantic_targets: sqlite-node-sqlite-node-22-18-0,better-sqlite3-node-22-18-0,libsql-local-node-22-18-0
            evidence_target: ""
            evidence_env: "{}"
          - id: oracle
            project: db-oracle
            semantic_targets: oracle-oracledb-thin-node-23-9
            evidence_target: ""
            evidence_env: "{}"
          - id: mssql
            project: db-mssql
            semantic_targets: mssql-tedious-developer-node-2022-cu18
            evidence_target: ""
            evidence_env: "{}"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared
      - name: Restore prepared build
        run: tar -xzf "$RUNNER_TEMP/prepared/prepared-build.tar.gz" -C "$GITHUB_WORKSPACE"
      - name: Run isolated database project
        env:
          SQLBRAID_SUPPORT_EVIDENCE_DIR: ${{ runner.temp }}/ci-evidence/ci-evidence-${{ matrix.id }}/observations
          SQLBRAID_POSTGRES_TARGET: ${{ matrix.postgres_target }}
        shell: bash
        run: |
          if [[ -z "${SQLBRAID_POSTGRES_TARGET:-}" ]]; then unset SQLBRAID_POSTGRES_TARGET; fi
          mkdir -p "$RUNNER_TEMP/ci-evidence/ci-evidence-${{ matrix.id }}/observations"
          report="$RUNNER_TEMP/ci-evidence/ci-evidence-${{ matrix.id }}/results.json"
          set +e
          pnpm exec vitest run --project "${{ matrix.project }}" --reporter=default --reporter=json --outputFile.json="$report"
          status=$?
          if [[ ! -s "$report" ]]; then
            printf '{"success":false,"testResults":[]}\n' > "$report"
          fi
          printf '{"success":%s}\n' "$([ "$status" -eq 0 ] && echo true || echo false)" > "$RUNNER_TEMP/ci-evidence/ci-evidence-${{ matrix.id }}/status.json"
          exit "$status"
      - name: Bind semantic integration evidence to this revision
        run: >-
          node scripts/validate-contract-matrix.mjs
          --record-report "$RUNNER_TEMP/ci-evidence/ci-evidence-${{ matrix.id }}/results.json"
          --source-sha "$GITHUB_SHA" --layer integration --targets "${{ matrix.semantic_targets }}"
      - name: Record additional exact-target evidence
        if: ${{ success() && matrix.evidence_target != '' }}
        env:
          SQLBRAID_EVIDENCE_ENV: ${{ matrix.evidence_env }}
        shell: bash
        run: |
          while IFS=$'\t' read -r name value; do
            export "$name=$value"
          done < <(node -e 'for (const [name, value] of Object.entries(JSON.parse(process.argv[1]))) console.log(`${name}\t${value}`)' "$SQLBRAID_EVIDENCE_ENV")
          mkdir -p "$RUNNER_TEMP/release-target-evidence"
          node scripts/support-evidence.mjs \
            "$RUNNER_TEMP/ci-evidence/ci-evidence-${{ matrix.id }}/results.json" \
            "$RUNNER_TEMP/release-target-evidence/${{ matrix.evidence_target }}.json" \
            "$RUNNER_TEMP/ci-evidence/ci-evidence-${{ matrix.id }}/observations"
      - name: Preserve database evidence shard
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-evidence-${{ matrix.id }}
          path: ${{ runner.temp }}/ci-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Preserve additional exact-target evidence
        if: ${{ success() && matrix.evidence_target != '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-target-evidence-${{ matrix.evidence_target }}
          path: ${{ runner.temp }}/release-target-evidence
          if-no-files-found: error
          retention-days: 14

  release-node24:
    needs: release-prep
    name: Node 24 compatibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_COMPAT_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared
      - name: Restore prepared build
        run: tar -xzf "$RUNNER_TEMP/prepared/prepared-build.tar.gz" -C "$GITHUB_WORKSPACE"
      - run: pnpm run test:compat:node24

  release-browser:
    needs: release-prep
    name: Browser, D1, and SQLite WASM release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared
      - name: Restore prepared build
        run: tar -xzf "$RUNNER_TEMP/prepared/prepared-build.tar.gz" -C "$GITHUB_WORKSPACE"
      - run: pnpm --dir tests exec playwright install --with-deps chromium
      - name: Run web-runtime tests
        env:
          SQLBRAID_SUPPORT_EVIDENCE_DIR: ${{ runner.temp }}/ci-evidence/ci-evidence-web/observations
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ci-evidence/ci-evidence-web/observations"
          report="$RUNNER_TEMP/ci-evidence/ci-evidence-web/results.json"
          set +e
          pnpm exec vitest run --project db-d1 --project db-wasm --reporter=default --reporter=json --outputFile.json="$report"
          status=$?
          if [[ "$status" -eq 0 ]]; then pnpm run test:d1; status=$?; fi
          if [[ "$status" -eq 0 ]]; then pnpm run test:browser; status=$?; fi
          if [[ ! -s "$report" ]]; then
            printf '{"success":false,"testResults":[]}\n' > "$report"
          elif [[ "$status" -ne 0 ]]; then
            node -e 'const fs=require("node:fs"); const path=process.argv[1]; const report=JSON.parse(fs.readFileSync(path,"utf8")); report.success=false; fs.writeFileSync(path, `${JSON.stringify(report)}\n`);' "$report"
          fi
          printf '{"success":%s}\n' "$([ "$status" -eq 0 ] && echo true || echo false)" > "$RUNNER_TEMP/ci-evidence/ci-evidence-web/status.json"
          exit "$status"
      - name: Bind web semantic evidence to this revision
        run: >-
          node scripts/validate-contract-matrix.mjs
          --record-report "$RUNNER_TEMP/ci-evidence/ci-evidence-web/results.json"
          --source-sha "$GITHUB_SHA" --layer integration
          --targets sqlite-wasm-browser-3-53-4,d1-cloudflare-workerd-2026-07-30
      - name: Preserve web evidence shard
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-evidence-web
          path: ${{ runner.temp }}/ci-evidence
          if-no-files-found: error
          retention-days: 14

  release-pack:
    if: github.event_name != 'schedule'
    needs: release-prep
    name: Validate immutable npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared
      - run: |
          tar -xzf "$RUNNER_TEMP/prepared/prepared-build.tar.gz" -C "$GITHUB_WORKSPACE"
          tar -xzf "$RUNNER_TEMP/prepared/release-candidate.tar.gz" -C "$RUNNER_TEMP"
      - name: Run package consumer project
        run: pnpm exec vitest run --project consumer
      - name: Validate candidate package bytes
        env:
          SQLBRAID_PACK_INPUT_DIR: ${{ runner.temp }}/sqlbraid-release-artifacts
          SQLBRAID_SKIP_VSIX: "true"
        run: pnpm run pack:check
      - name: Run isolated facade and API-only consumer gates
        env:
          SQLBRAID_PACK_INPUT_DIR: ${{ runner.temp }}/sqlbraid-release-artifacts
        run: pnpm run test:consumer:gates
      - name: Preserve validated candidate
        run: tar -czf "$RUNNER_TEMP/release-candidate-validated.tar.gz" -C "$RUNNER_TEMP" sqlbraid-release-artifacts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-candidate-validated
          path: ${{ runner.temp }}/release-candidate-validated.tar.gz
          if-no-files-found: error
          retention-days: 14

  release-docs:
    if: github.event_name != 'schedule'
    needs: release-prep
    name: Documentation release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared
      - name: Restore prepared build
        run: tar -xzf "$RUNNER_TEMP/prepared/prepared-build.tar.gz" -C "$GITHUB_WORKSPACE"
      - run: pnpm run docs:build

  release-examples:
    if: github.event_name != 'schedule'
    needs: release-prep
    name: Packed examples release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared
      - run: |
          tar -xzf "$RUNNER_TEMP/prepared/prepared-build.tar.gz" -C "$GITHUB_WORKSPACE"
          tar -xzf "$RUNNER_TEMP/prepared/release-candidate.tar.gz" -C "$RUNNER_TEMP"
      - name: Run examples against immutable candidate tarballs
        env:
          SQLBRAID_PACK_INPUT_DIR: ${{ runner.temp }}/sqlbraid-release-artifacts
        run: pnpm run test:examples

  release-benchmark-smoke:
    if: github.event_name != 'schedule'
    needs: release-prep
    name: Release benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared
      - name: Restore prepared build
        run: tar -xzf "$RUNNER_TEMP/prepared/prepared-build.tar.gz" -C "$GITHUB_WORKSPACE"
      - run: pnpm run benchmark:release-smoke

  release-runtime:
    if: github.event_name != 'schedule'
    needs: release-prep
    name: Packed ${{ matrix.runtime }} runtime and drivers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2.2.0
        if: matrix.runtime == 'bun'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: denoland/setup-deno@v2.0.5
        if: matrix.runtime == 'deno'
        with:
          deno-version: v${{ env.DENO_VERSION }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared
      - name: Restore prepared build
        run: tar -xzf "$RUNNER_TEMP/prepared/prepared-build.tar.gz" -C "$GITHUB_WORKSPACE"
      - name: Node packed runtime gate
        if: matrix.runtime == 'node'
        env:
          SQLBRAID_USE_PREBUILT_DIST: "true"
          SQLBRAID_SUPPORT_EVIDENCE_DIR: ${{ runner.temp }}/runtime-observations
        run: pnpm run test:runtime:node
      - name: Bun packed runtime gate
        if: matrix.runtime == 'bun'
        env:
          SQLBRAID_USE_PREBUILT_DIST: "true"
          SQLBRAID_SUPPORT_EVIDENCE_DIR: ${{ runner.temp }}/runtime-observations
        run: pnpm run test:runtime:bun
      - name: Deno packed runtime gate
        if: matrix.runtime == 'deno'
        env:
          SQLBRAID_USE_PREBUILT_DIST: "true"
          SQLBRAID_SUPPORT_EVIDENCE_DIR: ${{ runner.temp }}/runtime-observations
        run: pnpm run test:runtime:deno
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.runtime }}-runtime-evidence
          path: ${{ runner.temp }}/runtime-observations
          if-no-files-found: error
          retention-days: 14

  release-compatibility:
    if: github.event_name != 'schedule'
    needs: release-prep
    name: Packed Node ${{ matrix.node }} compatibility (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-prep.outputs.compatibility_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared
      - name: Restore immutable candidate tarballs
        run: tar -xzf "$RUNNER_TEMP/prepared/release-candidate.tar.gz" -C "$RUNNER_TEMP"
      - name: Run packed consumer smoke
        env:
          SQLBRAID_COMPAT_CELL: ${{ matrix.id }}
          SQLBRAID_COMPAT_PACKAGE_DIR: ${{ runner.temp }}/sqlbraid-release-artifacts
        run: node scripts/runtime-compatibility-smoke.mjs

  release-bun-sql:
    needs: release-prep
    name: Bun.SQL release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared
      - name: Restore prepared build
        run: tar -xzf "$RUNNER_TEMP/prepared/prepared-build.tar.gz" -C "$GITHUB_WORKSPACE"
      - name: Run Bun.SQL Vitest project
        env:
          SQLBRAID_SUPPORT_EVIDENCE_DIR: ${{ runner.temp }}/ci-evidence/ci-evidence-bun-sql/observations
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ci-evidence/ci-evidence-bun-sql/observations"
          report="$RUNNER_TEMP/ci-evidence/ci-evidence-bun-sql/results.json"
          set +e
          pnpm exec vitest run --project db-bun-sql --reporter=default --reporter=json --outputFile.json="$report"
          status=$?
          if [[ ! -s "$report" ]]; then
            printf '{"success":false,"testResults":[]}\n' > "$report"
          fi
          printf '{"success":%s}\n' "$([ "$status" -eq 0 ] && echo true || echo false)" > "$RUNNER_TEMP/ci-evidence/ci-evidence-bun-sql/status.json"
          exit "$status"
      - name: Bind Bun.SQL semantic evidence to this revision
        run: >-
          node scripts/validate-contract-matrix.mjs
          --record-report "$RUNNER_TEMP/ci-evidence/ci-evidence-bun-sql/results.json"
          --source-sha "$GITHUB_SHA" --layer integration
          --targets bun-sql-postgres,bun-sql-mysql,bun-sql-mariadb,bun-sql-sqlite
      - name: Preserve Bun.SQL evidence shard
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-evidence-bun-sql
          path: ${{ runner.temp }}/ci-evidence
          if-no-files-found: error
          retention-days: 14

  release-semantic-contracts:
    needs: [release-prep, release-common, release-db, release-browser, release-bun-sql]
    if: always()
    name: Require complete semantic contract matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful integration and boundary lanes
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'for (const [id, job] of Object.entries(JSON.parse(process.env.RESULTS))) if (job.result !== "success") throw new Error(`Required semantic lane ${id} did not pass`)'
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-evidence-*
          path: ${{ runner.temp }}/semantic-evidence/integration
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-semantic-boundary
          path: ${{ runner.temp }}/semantic-evidence/boundary
      - name: Reject missing, excluded, failed or stale semantic coverage
        run: node scripts/validate-contract-matrix.mjs --reports "$RUNNER_TEMP/semantic-evidence" --source-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-semantic-contracts
          path: ${{ runner.temp }}/semantic-evidence
          if-no-files-found: error
          retention-days: 90

  release-support-evidence:
    needs: [release-prep, release-common, release-db, release-browser, release-bun-sql]
    if: always()
    name: Aggregate release support evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require all authoritative evidence lanes
        env:
          PREP_RESULT: ${{ needs.release-prep.result }}
          COMMON_RESULT: ${{ needs.release-common.result }}
          DB_RESULT: ${{ needs.release-db.result }}
          BROWSER_RESULT: ${{ needs.release-browser.result }}
          BUN_SQL_RESULT: ${{ needs.release-bun-sql.result }}
        shell: bash
        run: |
          for result in "$PREP_RESULT" "$COMMON_RESULT" "$DB_RESULT" "$BROWSER_RESULT" "$BUN_SQL_RESULT"; do
            [[ "$result" == success ]] || { echo "Required evidence lane did not pass: $result"; exit 1; }
          done
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-evidence-*
          path: ${{ runner.temp }}/release-evidence
          merge-multiple: true
      - name: Merge default support evidence shards
        env:
          EXPECTED_SHARDS: ${{ env.RELEASE_DEFAULT_EVIDENCE_SHARDS }}
        run: |
          node scripts/merge-vitest-results.mjs \
            --output "$RUNNER_TEMP/merged-results.json" \
            --input-root "$RUNNER_TEMP/release-evidence" \
            --expected "$EXPECTED_SHARDS" \
            --observations-output "$RUNNER_TEMP/merged-observations"
      - name: Record default support evidence
        run: node scripts/support-evidence.mjs "$RUNNER_TEMP/merged-results.json" "$RUNNER_TEMP/support-evidence.json" "$RUNNER_TEMP/merged-observations"
      - name: Preserve default support evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: support-profile-evidence
          path: ${{ runner.temp }}/support-evidence.json
          if-no-files-found: error
          retention-days: 14

  release-target-evidence:
    needs: release-db
    if: always()
    name: Validate additional target evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require complete database matrix
        env:
          DB_RESULT: ${{ needs.release-db.result }}
        shell: bash
        run: |
          [[ "$DB_RESULT" == success ]] || { echo "Database matrix did not pass: $DB_RESULT"; exit 1; }
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-target-evidence-*
          path: ${{ runner.temp }}/release-target-evidence
          merge-multiple: true
      - name: Require matrix-provided exact-target evidence
        shell: bash
        run: |
          shopt -s nullglob
          evidence=("$RUNNER_TEMP"/release-target-evidence/*.json)
          (( ${#evidence[@]} > 0 )) || { echo "No additional target evidence was produced by the matrix."; exit 1; }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-target-evidence
          path: ${{ runner.temp }}/release-target-evidence
          if-no-files-found: error
          retention-days: 14

  release-certification:
    if: github.event_name != 'schedule'
    needs: release-prep
    uses: ./.github/workflows/driver-certification.yml
    permissions:
      contents: read
      actions: read
    with:
      stress: true
      prepared_artifact_name: release-prepared
      candidate_artifact_name: release-certification-candidate
      prepared_run_id: ${{ github.run_id }}

  release-final:
    if: github.event_name != 'schedule'
    needs:
      [
        release-prep,
        release-common,
        release-db,
        release-node24,
        release-browser,
        release-pack,
        release-docs,
        release-examples,
        release-benchmark-smoke,
        release-runtime,
        release-compatibility,
        release-bun-sql,
        release-support-evidence,
        release-target-evidence,
        release-certification,
        release-semantic-contracts,
      ]
    name: Final release certification
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact release ref
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-candidate-validated
          path: ${{ runner.temp }}/validated
      - run: tar -xzf "$RUNNER_TEMP/validated/release-candidate-validated.tar.gz" -C "$RUNNER_TEMP"
      - name: Assert exact candidate and tag invariants
        run: node scripts/release.mjs --mode preflight
      - name: pnpm stage dry run
        if: env.SQLBRAID_RELEASE_MODE != 'pack-only'
        env:
          PRIOR_RUN_ID: ${{ inputs.prior_run_id }}
        shell: bash
        run: |
          args=(node scripts/release.mjs --mode stage-dry-run --artifact-dir "$RUNNER_TEMP/sqlbraid-release-artifacts")
          if [[ -n "$PRIOR_RUN_ID" ]]; then
            args+=(--prior-candidate-run-id "$PRIOR_RUN_ID")
          fi
          "${args[@]}"

  release-stage:
    if: github.event_name == 'workflow_dispatch' && inputs.release_mode == 'stage'
    needs: release-final
    name: Stage validated packages with pnpm OIDC
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: npm-stage-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact release ref
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-candidate-validated
          path: ${{ runner.temp }}/validated
      - run: tar -xzf "$RUNNER_TEMP/validated/release-candidate-validated.tar.gz" -C "$RUNNER_TEMP"
      - name: Download prior staged evidence for explicit reconciliation
        if: inputs.prior_run_id != ''
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-staged-publication
          path: ${{ runner.temp }}/prior-staged-evidence
          run-id: ${{ inputs.prior_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Stage validated tarballs with pnpm provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRIOR_RUN_ID: ${{ inputs.prior_run_id }}
        shell: bash
        run: |
          args=(node scripts/release.mjs --mode stage --artifact-dir "$RUNNER_TEMP/sqlbraid-release-artifacts")
          if [[ -n "$PRIOR_RUN_ID" ]]; then
            [[ "$PRIOR_RUN_ID" =~ ^[0-9]+$ ]] || { echo "prior_run_id must be numeric."; exit 1; }
            args+=(--prior-candidate-run-id "$PRIOR_RUN_ID"
              --prior-staged-publication "$RUNNER_TEMP/prior-staged-evidence/staged-publication.json")
          fi
          "${args[@]}"
      - name: Preserve staged publication evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-staged-publication
          path: |
            ${{ runner.temp }}/sqlbraid-release-artifacts/staged-publication.json
            ${{ runner.temp }}/sqlbraid-release-artifacts/release-manifest.json
          if-no-files-found: error
          retention-days: 14

  release-draft:
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      inputs.release_mode == 'stage' && needs.release-stage.result == 'success'
    needs: [release-final, release-stage]
    name: Create draft GitHub Release after staging (approval pending)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact release ref
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-candidate-validated
          path: ${{ runner.temp }}/validated
      - run: tar -xzf "$RUNNER_TEMP/validated/release-candidate-validated.tar.gz" -C "$RUNNER_TEMP"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-staged-publication
          path: ${{ runner.temp }}/staged-evidence
      - uses: actions/download-artifact@v8.0.1
        with:
          name: support-profile-evidence
          path: ${{ runner.temp }}/support-evidence
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-target-evidence
          path: ${{ runner.temp }}/release-target-evidence
      - name: Create compact durable release evidence
        run: >-
          node scripts/release.mjs --mode durable-evidence
          --artifact-dir "$RUNNER_TEMP/sqlbraid-release-artifacts"
          --manifest "$RUNNER_TEMP/staged-evidence/release-manifest.json"
          --staged-publication "$RUNNER_TEMP/staged-evidence/staged-publication.json"
          --support-evidence "$RUNNER_TEMP/support-evidence/support-evidence.json"
          --target-evidence-dir "$RUNNER_TEMP/release-target-evidence"
      - name: Create draft GitHub Release (approval pending)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=(gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft
            --title "SQLBraid $GITHUB_REF_NAME"
            --notes-file docs/SQLBraid_0.1.0_release_notes.md)
          if [[ "$(node scripts/release.mjs --mode release-prerelease-flag --version "${GITHUB_REF_NAME#v}")" == "--prerelease" ]]; then
            args+=(--prerelease)
          fi
          args+=(
            "$RUNNER_TEMP/staged-evidence/release-manifest.json"
            "$RUNNER_TEMP/staged-evidence/staged-publication.json"
            "$RUNNER_TEMP/sqlbraid-release-artifacts/release-evidence.json"
          )
          "${args[@]}"

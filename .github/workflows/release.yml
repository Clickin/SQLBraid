name: Release

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: RC validation mode (never publishes)
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - pack-only
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  postgres-current-capabilities:
    name: PostgreSQL 18 current capability gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: sqlbraid
          POSTGRES_PASSWORD: sqlbraid-test
          POSTGRES_DB: sqlbraid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sqlbraid"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SQLBRAID_POSTGRES_URL: postgres://sqlbraid:sqlbraid-test@127.0.0.1:5432/sqlbraid
      SQLBRAID_POSTGRES_VERSION: 18.6
    steps:
      - name: Check out exact source
        uses: actions/checkout@v7.0.1
      - name: Set up Node 22.18.0
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0
      - name: Set up pnpm 12.3.4
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.3.4
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm run build
      - name: PostgreSQL 18 capability fixtures
        run: pnpm exec vitest run --project db-postgres tests/db/postgres/capabilities.test.ts

  release:
    needs: postgres-current-capabilities
    name: Immutable release gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: sqlbraid
          POSTGRES_PASSWORD: sqlbraid-test
          POSTGRES_DB: sqlbraid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sqlbraid"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4.2
        env:
          MYSQL_DATABASE: sqlbraid
          MYSQL_USER: sqlbraid
          MYSQL_PASSWORD: sqlbraid-test
          MYSQL_ROOT_PASSWORD: sqlbraid-root-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -psqlbraid-root-test"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.8.9
        env:
          MARIADB_DATABASE: sqlbraid
          MARIADB_USER: sqlbraid
          MARIADB_PASSWORD: sqlbraid-test
          MARIADB_ROOT_PASSWORD: sqlbraid-root-test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -u root -p'sqlbraid-root-test'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      SQLBRAID_POSTGRES_URL: postgres://sqlbraid:sqlbraid-test@127.0.0.1:5432/sqlbraid
      SQLBRAID_MYSQL_URL: mysql://sqlbraid:sqlbraid-test@127.0.0.1:3306/sqlbraid
      SQLBRAID_MARIADB_URL: mariadb://sqlbraid:sqlbraid-test@127.0.0.1:3307/sqlbraid
    steps:
      - name: Check out exact release ref
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Select runner-local artifact paths
        run: |
          echo "SQLBRAID_RELEASE_ARTIFACT_DIR=$RUNNER_TEMP/sqlbraid-release-artifacts" >> "$GITHUB_ENV"
          echo "SQLBRAID_VSIX_OUTPUT=$RUNNER_TEMP/sqlbraid-release-artifacts/sqlbraid.vsix" >> "$GITHUB_ENV"

      - name: Set up Node 22.18.0
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0

      - name: Set up pnpm 12.3.4
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.3.4

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Deno 2.9.3
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.3

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser conformance runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Determine release version from manifest and tag
        shell: bash
        run: |
          manifest_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            [[ "$GITHUB_REF_NAME" == v* ]] || { echo "Release tags must start with v."; exit 1; }
            [[ "$tag_version" == "$manifest_version" ]] || {
              echo "Tag version $tag_version does not match package.json version $manifest_version."
              exit 1
            }
            echo "SQLBRAID_RELEASE_VERSION=$tag_version" >> "$GITHUB_ENV"
          else
            echo "SQLBRAID_RELEASE_VERSION=$manifest_version" >> "$GITHUB_ENV"
          fi

      - name: Assert clean tree, versions, and release ref
        run: node scripts/release.mjs --mode preflight

      - name: Install npm trusted-publishing CLI
        if: github.event_name == 'push' || inputs.release_mode == 'dry-run'
        run: npm install --global npm@11.15.0

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build packages and extension
        run: pnpm run build

      - name: Unit, CLI, and real SQLite gate
        run: pnpm test

      - name: Real SQLite gate
        run: pnpm run test:db:sqlite

      - name: Real PostgreSQL gate
        run: pnpm run test:db:postgres

      - name: Real MySQL gate
        run: pnpm run test:db:mysql

      - name: Real MariaDB gate
        run: pnpm run test:db:mariadb

      - name: Dialect capability conformance
        run: pnpm run test:capabilities

      - name: Bulk conformance
        run: pnpm run test:bulk

      - name: Browser SQLite WASM gate
        run: pnpm run test:browser

      - name: D1 local binding gate
        run: pnpm run test:d1

      - name: Bulk structural benchmark
        run: pnpm run benchmark:bulk

      - name: Real Oracle gate
        run: pnpm run test:db:oracle

      - name: Real SQL Server gate
        run: pnpm run test:db:mssql

      - name: Streaming and routine conformance
        run: pnpm run test:streaming && pnpm run test:routines

      - name: Vite transform gate
        run: pnpm run test:vite

      - name: Set up Node 24 finance consumer
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0

      - name: Packed TanStack Start dev build HMR SSR gate
        run: pnpm run test:tanstack-start

      - name: Restore pinned runtime Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0

      - name: Packed consumer gate
        run: pnpm run test:consumer

      - name: Select Node 24 for full finance-inclusive gate
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0

      - name: Full test and VS Code source host gate
        run: pnpm run test:all

      - name: Restore Node 22 runtime evidence
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0

      - name: VS Code host gate
        run: pnpm run test:vscode

      - name: Node packed runtime gate
        run: pnpm run test:runtime:node

      - name: Bun packed runtime gate
        run: pnpm run test:runtime:bun

      - name: Deno packed runtime gate
        run: pnpm run test:runtime:deno

      - name: Documentation site gate
        run: pnpm run docs:build

      - name: Packed examples gate
        run: pnpm run test:examples

      - name: Pack immutable release candidate
        run: >-
          node scripts/release.mjs
          --mode pack
          --artifact-dir "$SQLBRAID_RELEASE_ARTIFACT_DIR"

      - name: Pack hygiene and installed VSIX host gate
        env:
          SQLBRAID_PACK_INPUT_DIR: ${{ runner.temp }}/sqlbraid-release-artifacts
        run: pnpm run pack:check

      - name: Preserve validated release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sqlbraid-${{ github.event_name == 'push' && github.ref_name || 'rc' }}
          path: ${{ runner.temp }}/sqlbraid-release-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: npm publication dry run
        if: github.event_name == 'workflow_dispatch' && inputs.release_mode == 'dry-run'
        run: node scripts/release.mjs --mode publish-dry-run --artifact-dir "$SQLBRAID_RELEASE_ARTIFACT_DIR"

      - name: Publish validated tarballs with npm provenance
        if: github.event_name == 'push'
        run: node scripts/release.mjs --mode publish --artifact-dir "$SQLBRAID_RELEASE_ARTIFACT_DIR"

      - name: Create a draft GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft
          --title "SQLBraid $GITHUB_REF_NAME"
          --notes-file docs/SQLBraid_0.1.0_release_notes.md
          "$SQLBRAID_VSIX_OUTPUT"

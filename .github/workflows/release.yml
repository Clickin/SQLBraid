name: Release

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: RC validation mode (never publishes)
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - pack-only
  push:
    tags:
      - "v*"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write
  id-token: write

jobs:
  postgres-current-capabilities:
    name: PostgreSQL 18 current capability gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SQLBRAID_POSTGRES_TARGET: postgres-current
    steps:
      - name: Check out exact source
        uses: actions/checkout@v7.0.1
      - name: Set up Node 22.18.0
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0
      - name: Set up pnpm 12.3.4
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.3.4
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm run build
      - name: PostgreSQL 18 capability fixtures
        env:
          SQLBRAID_SUPPORT_EVIDENCE_DIR: ${{ runner.temp }}/pg-current-observations
        run: pnpm exec vitest run --project db-postgres tests/db/postgres/capabilities.test.ts tests/db/postgres/containers.test.ts --reporter=default --reporter=json --outputFile.json=${{ runner.temp }}/pg-current-results.json
      - name: Record current-target executed evidence
        run: node scripts/support-evidence.mjs "${{ runner.temp }}/pg-current-results.json" "${{ runner.temp }}/pg-current-evidence.json" "${{ runner.temp }}/pg-current-observations"
      - name: Preserve current-target evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: postgres-current-support-evidence
          path: ${{ runner.temp }}/pg-current-evidence.json
          if-no-files-found: error

  release:
    if: github.event_name != 'schedule'
    needs: postgres-current-capabilities
    name: Immutable release gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16.4-alpine
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sqlbraid
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
      mysql:
        image: mysql:8.4.2
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -psqlbraid"
          --health-interval 10s --health-timeout 5s --health-retries 10
        env:
          MYSQL_ROOT_PASSWORD: sqlbraid
          MYSQL_DATABASE: mysql
        ports:
          - 3306:3306
      mariadb:
        image: mariadb:11.8.9
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 10
        env:
          MARIADB_ROOT_PASSWORD: sqlbraid
          MARIADB_DATABASE: mysql
        ports:
          - 3307:3306
    steps:
      - name: Check out exact release ref
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Select runner-local artifact paths
        run: |
          echo "SQLBRAID_RELEASE_ARTIFACT_DIR=$RUNNER_TEMP/sqlbraid-release-artifacts" >> "$GITHUB_ENV"
          echo "SQLBRAID_VSIX_OUTPUT=$RUNNER_TEMP/sqlbraid-release-artifacts/sqlbraid.vsix" >> "$GITHUB_ENV"

      - name: Set up Node 22.18.0
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0

      - name: Set up pnpm 12.3.4
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.3.4

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Deno 2.9.3
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.3

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser conformance runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Determine release version from manifest and tag
        shell: bash
        run: |
          manifest_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            [[ "$GITHUB_REF_NAME" == v* ]] || { echo "Release tags must start with v."; exit 1; }
            [[ "$tag_version" == "$manifest_version" ]] || {
              echo "Tag version $tag_version does not match package.json version $manifest_version."
              exit 1
            }
            echo "SQLBRAID_RELEASE_VERSION=$tag_version" >> "$GITHUB_ENV"
          else
            echo "SQLBRAID_RELEASE_VERSION=$manifest_version" >> "$GITHUB_ENV"
          fi

      - name: Assert clean tree, versions, and release ref
        run: node scripts/release.mjs --mode preflight

      - name: Install npm trusted-publishing CLI
        if: github.event_name == 'push' || inputs.release_mode == 'dry-run'
        run: npm install --global npm@11.15.0

      - name: Typecheck
        run: pnpm run typecheck

      - name: Validate support claims and translation freshness
        run: pnpm run support:validate && pnpm run docs:translations

      - name: Build packages and extension
        run: pnpm run build

      - name: Node 22 unit, consumers and real-driver fidelity
        env:
          SQLBRAID_SUPPORT_EVIDENCE_DIR: ${{ runner.temp }}/support-observations
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile.json=${{ runner.temp }}/support-results.json

      - name: Bulk structural benchmark
        run: pnpm run benchmark:bulk

      - name: Value fidelity normalization benchmark
        run: pnpm run benchmark:fidelity

      - name: Select Node 24 for full finance-inclusive gate
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0

      - name: Full test and VS Code source host gate
        run: pnpm run test:all

      - name: Restore Node 22 runtime evidence
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0

      - name: Node packed runtime gate
        env:
          SQLBRAID_SUPPORT_EVIDENCE_DIR: ${{ runner.temp }}/runtime-observations
        run: pnpm run test:runtime:node

      - name: Bun packed runtime gate
        env:
          SQLBRAID_SUPPORT_EVIDENCE_DIR: ${{ runner.temp }}/runtime-observations
        run: pnpm run test:runtime:bun

      - name: Bun.SQL first-party driver matrix gate
        env:
          SQLBRAID_SUPPORT_EVIDENCE_DIR: ${{ runner.temp }}/bun-sql-observations
          SQLBRAID_BUN_SQL_POSTGRES_URL: postgres://postgres:sqlbraid@127.0.0.1:5432/postgres
          SQLBRAID_BUN_SQL_MYSQL_URL: mysql://root:sqlbraid@127.0.0.1:3306/mysql
          SQLBRAID_BUN_SQL_MARIADB_URL: mysql://root:sqlbraid@127.0.0.1:3307/mysql
        run: pnpm run test:runtime:bun-sql

      - name: Preserve Bun.SQL tuple evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bun-sql-runtime-tuple-evidence
          path: ${{ runner.temp }}/bun-sql-observations
          if-no-files-found: error
          retention-days: 14

      - name: Deno packed runtime gate
        env:
          SQLBRAID_SUPPORT_EVIDENCE_DIR: ${{ runner.temp }}/runtime-observations
        run: pnpm run test:runtime:deno

      - name: Preserve packed runtime tuple evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packed-runtime-tuple-evidence
          path: ${{ runner.temp }}/runtime-observations
          if-no-files-found: error
          retention-days: 14

      - name: Documentation site gate
        run: pnpm run docs:build

      - name: Packed examples gate
        run: pnpm run test:examples

      - name: Pack immutable release candidate
        run: >-
          node scripts/release.mjs
          --mode pack
          --artifact-dir "$SQLBRAID_RELEASE_ARTIFACT_DIR"

      - name: Pack hygiene and installed VSIX host gate
        env:
          SQLBRAID_PACK_INPUT_DIR: ${{ runner.temp }}/sqlbraid-release-artifacts
        run: pnpm run pack:check

      - name: Preserve validated release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sqlbraid-${{ github.event_name == 'push' && github.ref_name || 'rc' }}
          path: ${{ runner.temp }}/sqlbraid-release-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Record executed support evidence
        run: node scripts/support-evidence.mjs "${{ runner.temp }}/support-results.json" "${{ runner.temp }}/support-evidence.json" "${{ runner.temp }}/support-observations"

      - name: Preserve exact profile evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: support-profile-evidence
          path: ${{ runner.temp }}/support-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: npm publication dry run
        if: github.event_name == 'workflow_dispatch' && inputs.release_mode == 'dry-run'
        run: node scripts/release.mjs --mode publish-dry-run --artifact-dir "$SQLBRAID_RELEASE_ARTIFACT_DIR"

      - name: Publish validated tarballs with npm provenance
        if: github.event_name == 'push'
        run: node scripts/release.mjs --mode publish --artifact-dir "$SQLBRAID_RELEASE_ARTIFACT_DIR"

      - name: Create a draft GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft
          --title "SQLBraid $GITHUB_REF_NAME"
          --notes-file docs/SQLBraid_0.1.0_release_notes.md
          "$SQLBRAID_VSIX_OUTPUT"

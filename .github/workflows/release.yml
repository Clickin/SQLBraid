name: Release

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: RC validation mode (never publishes)
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - pack-only
  push:
    tags:
      - "v*"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: 22.18.0
  NODE_COMPAT_VERSION: 24.21.0
  PNPM_VERSION: 12.3.4
  BUN_VERSION: 1.3.14
  DENO_VERSION: 2.9.3

jobs:
  postgres-current-capabilities:
    name: PostgreSQL 18 current capability gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SQLBRAID_POSTGRES_TARGET: postgres-current
    steps:
      - name: Check out exact source
        uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm run build
      - name: PostgreSQL 18 capability fixtures
        env:
          SQLBRAID_SUPPORT_EVIDENCE_DIR: ${{ runner.temp }}/pg-current-observations
        run: pnpm exec vitest run --project db-postgres tests/db/postgres/capabilities.test.ts tests/db/postgres/containers.test.ts --reporter=default --reporter=json --outputFile.json=${{ runner.temp }}/pg-current-results.json
      - name: Record current-target executed evidence
        run: node scripts/support-evidence.mjs "${{ runner.temp }}/pg-current-results.json" "${{ runner.temp }}/pg-current-evidence.json" "${{ runner.temp }}/pg-current-observations"
      - name: Preserve current-target evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: postgres-current-support-evidence
          path: ${{ runner.temp }}/pg-current-evidence.json
          if-no-files-found: error

  release-prep:
    if: github.event_name != 'schedule'
    name: Prepare immutable release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact release ref
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Determine release version
        shell: bash
        run: |
          manifest_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            [[ "$GITHUB_REF_NAME" == v* && "$tag_version" == "$manifest_version" ]] || {
              echo "Release tag and package version must match."
              exit 1
            }
            echo "SQLBRAID_RELEASE_VERSION=$tag_version" >> "$GITHUB_ENV"
          else
            echo "SQLBRAID_RELEASE_VERSION=$manifest_version" >> "$GITHUB_ENV"
          fi
      - name: Assert clean tree and exact ref
        run: node scripts/release.mjs --mode preflight
      - name: Validate support and translations
        run: pnpm run support:validate && pnpm run docs:translations
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build packages and extension once
        run: pnpm run build
      - name: Pack immutable release candidate
        env:
          SQLBRAID_RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/sqlbraid-release-artifacts
        run: node scripts/release.mjs --mode pack --artifact-dir "$SQLBRAID_RELEASE_ARTIFACT_DIR"
      - name: Archive candidate and prepared build
        run: |
          tar -czf "$RUNNER_TEMP/release-candidate.tar.gz" -C "$RUNNER_TEMP" sqlbraid-release-artifacts
          tar -czf "$RUNNER_TEMP/prepared-build.tar.gz" packages/*/dist extensions/vscode/dist
      - name: Preserve release preparation
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-prepared
          path: |
            ${{ runner.temp }}/release-candidate.tar.gz
            ${{ runner.temp }}/prepared-build.tar.gz
          if-no-files-found: error
          retention-days: 14

  release-node22:
    if: github.event_name != 'schedule'
    needs: release-prep
    name: Node 22 complete Vitest and support evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared
      - run: tar -xzf "$RUNNER_TEMP/prepared/prepared-build.tar.gz" -C "$GITHUB_WORKSPACE"
      - name: Install browser runtime for WASM Vitest project
        run: pnpm exec playwright install --with-deps chromium
      - name: Node 22 complete Vitest gate
        env:
          SQLBRAID_SUPPORT_EVIDENCE_DIR: ${{ runner.temp }}/support-observations
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile.json=${{ runner.temp }}/support-results.json
      - name: Record executed support evidence
        run: node scripts/support-evidence.mjs "${{ runner.temp }}/support-results.json" "${{ runner.temp }}/support-evidence.json" "${{ runner.temp }}/support-observations"
      - name: Preserve support evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: support-profile-evidence
          path: ${{ runner.temp }}/support-evidence.json
          if-no-files-found: error
          retention-days: 14

  release-node24:
    if: github.event_name != 'schedule'
    needs: release-prep
    name: Node 24 full Vitest compatibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_COMPAT_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared
      - run: tar -xzf "$RUNNER_TEMP/prepared/prepared-build.tar.gz" -C "$GITHUB_WORKSPACE"
      - name: Install browser runtime for WASM Vitest project
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run typecheck
      - run: pnpm exec vitest run

  release-browser:
    if: github.event_name != 'schedule'
    needs: release-prep
    name: Browser and D1 release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared
      - run: tar -xzf "$RUNNER_TEMP/prepared/prepared-build.tar.gz" -C "$GITHUB_WORKSPACE"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:d1 && pnpm run test:browser

  release-vscode:
    if: github.event_name != 'schedule'
    needs: release-prep
    name: VS Code source and host release gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared
      - run: tar -xzf "$RUNNER_TEMP/prepared/prepared-build.tar.gz" -C "$GITHUB_WORKSPACE"
      - run: pnpm run test:vscode

  release-pack:
    if: github.event_name != 'schedule'
    needs: release-prep
    name: Validate immutable packages and VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared
      - run: |
          tar -xzf "$RUNNER_TEMP/prepared/prepared-build.tar.gz" -C "$GITHUB_WORKSPACE"
          tar -xzf "$RUNNER_TEMP/prepared/release-candidate.tar.gz" -C "$RUNNER_TEMP"
      - name: Validate candidate package and VSIX bytes
        env:
          SQLBRAID_PACK_INPUT_DIR: ${{ runner.temp }}/sqlbraid-release-artifacts
          SQLBRAID_VSIX_OUTPUT: ${{ runner.temp }}/sqlbraid-release-artifacts/sqlbraid.vsix
        run: pnpm run pack:check
      - name: Preserve validated candidate
        run: tar -czf "$RUNNER_TEMP/release-candidate-validated.tar.gz" -C "$RUNNER_TEMP" sqlbraid-release-artifacts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-candidate-validated
          path: ${{ runner.temp }}/release-candidate-validated.tar.gz
          if-no-files-found: error
          retention-days: 14

  release-docs:
    if: github.event_name != 'schedule'
    needs: release-prep
    name: Documentation release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared
      - run: tar -xzf "$RUNNER_TEMP/prepared/prepared-build.tar.gz" -C "$GITHUB_WORKSPACE"
      - run: pnpm run docs:build

  release-examples:
    if: github.event_name != 'schedule'
    needs: release-prep
    name: Packed examples release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared
      - run: tar -xzf "$RUNNER_TEMP/prepared/prepared-build.tar.gz" -C "$GITHUB_WORKSPACE"
      - run: pnpm run test:examples

  release-benchmarks:
    if: github.event_name != 'schedule'
    needs: release-prep
    name: Release benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared
      - run: tar -xzf "$RUNNER_TEMP/prepared/prepared-build.tar.gz" -C "$GITHUB_WORKSPACE"
      - run: pnpm run benchmark:bulk && pnpm run benchmark:fidelity

  release-runtime:
    if: github.event_name != 'schedule'
    needs: release-prep
    name: Packed ${{ matrix.runtime }} runtime and drivers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2.2.0
        if: matrix.runtime == 'bun'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: denoland/setup-deno@v2.0.5
        if: matrix.runtime == 'deno'
        with:
          deno-version: v${{ env.DENO_VERSION }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared
      - run: tar -xzf "$RUNNER_TEMP/prepared/prepared-build.tar.gz" -C "$GITHUB_WORKSPACE"
      - name: Node packed runtime gate
        if: matrix.runtime == 'node'
        env:
          SQLBRAID_USE_PREBUILT_DIST: "true"
          SQLBRAID_SUPPORT_EVIDENCE_DIR: ${{ runner.temp }}/runtime-observations
        run: pnpm run test:runtime:node
      - name: Bun packed runtime gate
        if: matrix.runtime == 'bun'
        env:
          SQLBRAID_USE_PREBUILT_DIST: "true"
          SQLBRAID_SUPPORT_EVIDENCE_DIR: ${{ runner.temp }}/runtime-observations
        run: pnpm run test:runtime:bun
      - name: Deno packed runtime gate
        if: matrix.runtime == 'deno'
        env:
          SQLBRAID_USE_PREBUILT_DIST: "true"
          SQLBRAID_SUPPORT_EVIDENCE_DIR: ${{ runner.temp }}/runtime-observations
        run: pnpm run test:runtime:deno
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.runtime }}-runtime-evidence
          path: ${{ runner.temp }}/runtime-observations
          if-no-files-found: error
          retention-days: 14

  release-bun-sql:
    if: github.event_name != 'schedule'
    needs: release-prep
    name: Bun.SQL release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.4-alpine
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sqlbraid
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
      mysql:
        image: mysql:8.4.2
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -psqlbraid"
          --health-interval 10s --health-timeout 5s --health-retries 10
        env:
          MYSQL_ROOT_PASSWORD: sqlbraid
          MYSQL_DATABASE: mysql
        ports:
          - 3306:3306
      mariadb:
        image: mariadb:11.8.9
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 10
        env:
          MARIADB_ROOT_PASSWORD: sqlbraid
          MARIADB_DATABASE: mysql
        ports:
          - 3307:3306
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared
      - run: tar -xzf "$RUNNER_TEMP/prepared/prepared-build.tar.gz" -C "$GITHUB_WORKSPACE"
      - name: Bun.SQL first-party driver matrix
        env:
          SQLBRAID_USE_PREBUILT_DIST: "true"
          SQLBRAID_SUPPORT_EVIDENCE_DIR: ${{ runner.temp }}/bun-sql-observations
          SQLBRAID_BUN_SQL_POSTGRES_URL: postgres://postgres:sqlbraid@127.0.0.1:5432/postgres
          SQLBRAID_BUN_SQL_MYSQL_URL: mysql://root:sqlbraid@127.0.0.1:3306/mysql
          SQLBRAID_BUN_SQL_MARIADB_URL: mysql://root:sqlbraid@127.0.0.1:3307/mysql
        run: pnpm run test:runtime:bun-sql
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-bun-sql-evidence
          path: ${{ runner.temp }}/bun-sql-observations
          if-no-files-found: error
          retention-days: 14

  release-final:
    if: github.event_name != 'schedule'
    needs: [postgres-current-capabilities, release-prep, release-node22, release-node24, release-browser, release-vscode, release-pack, release-docs, release-examples, release-benchmarks, release-runtime, release-bun-sql]
    name: Final release certification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact release ref
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-candidate-validated
          path: ${{ runner.temp }}/validated
      - run: tar -xzf "$RUNNER_TEMP/validated/release-candidate-validated.tar.gz" -C "$RUNNER_TEMP"
      - name: Assert exact candidate and tag invariants
        run: node scripts/release.mjs --mode preflight
      - name: Install npm trusted-publishing CLI
        if: github.event_name == 'push' || inputs.release_mode == 'dry-run'
        run: npm install --global npm@11.15.0
      - name: npm publication dry run
        if: github.event_name == 'workflow_dispatch' && inputs.release_mode == 'dry-run'
        run: node scripts/release.mjs --mode publish-dry-run --artifact-dir "$RUNNER_TEMP/sqlbraid-release-artifacts"
      - name: Publish validated tarballs with npm provenance
        if: github.event_name == 'push'
        run: node scripts/release.mjs --mode publish --artifact-dir "$RUNNER_TEMP/sqlbraid-release-artifacts"
      - name: Create a draft GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft
          --title "SQLBraid $GITHUB_REF_NAME"
          --notes-file docs/SQLBraid_0.1.0_release_notes.md
          "$RUNNER_TEMP/sqlbraid-release-artifacts/sqlbraid.vsix"

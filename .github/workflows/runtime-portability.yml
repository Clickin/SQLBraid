name: Runtime portability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-release:
    name: Node 22.18.0 release gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.3.4
      - run: pnpm install --frozen-lockfile
      - name: Install browser conformance runtime
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Node 22 unit, consumers and real-driver fidelity
        run: pnpm exec vitest run
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
      - run: pnpm run test:all
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0
      - run: pnpm run test:runtime:node

  runtime-packed:
    name: Packed ${{ matrix.runtime }} runtime and drivers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.18.0
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.3.4
      - uses: oven-sh/setup-bun@v2.2.0
        if: matrix.runtime == 'bun'
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@v2.0.5
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.9.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:runtime:${{ matrix.runtime }}

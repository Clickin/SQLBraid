name: Runtime portability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-release:
    name: Node 22.18.0 release gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm run test:db:sqlite
      - run: pnpm run test:db:postgres
      - run: pnpm run test:db:mysql
      - run: pnpm run test:db:oracle
      - run: pnpm run test:db:mssql
      - run: pnpm run test:consumer
      - run: pnpm run test:all
      - run: pnpm run pack:check
      - run: pnpm run test:runtime:node

  runtime-packed:
    name: Packed ${{ matrix.runtime }} runtime and drivers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: sqlbraid
          POSTGRES_PASSWORD: sqlbraid-test
          POSTGRES_DB: sqlbraid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sqlbraid"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4.2
        env:
          MYSQL_DATABASE: sqlbraid
          MYSQL_USER: sqlbraid
          MYSQL_PASSWORD: sqlbraid-test
          MYSQL_ROOT_PASSWORD: sqlbraid-root-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -psqlbraid-root-test"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      SQLBRAID_POSTGRES_URL: postgres://sqlbraid:sqlbraid-test@127.0.0.1:5432/sqlbraid
      SQLBRAID_MYSQL_URL: mysql://sqlbraid:sqlbraid-test@127.0.0.1:3306/sqlbraid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.9.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:runtime:${{ matrix.runtime }}

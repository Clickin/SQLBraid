name: VS Code Release

on:
  workflow_dispatch:
    inputs:
      pre_release:
        description: "Publish this extension build as a pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  NODE_VERSION: 22.18.0
  PNPM_VERSION: 12.3.4
  OVSX_VERSION: 1.2.0

concurrency:
  group: vscode-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and validate VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.identity.outputs.version }}
      filename: ${{ steps.identity.outputs.filename }}
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Read extension identity
        id: identity
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('extensions/vscode/package.json', 'utf8')).version")"
          node -e '
            const version = process.argv[1];
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
            if (!match || match.slice(1).map(Number).every((n) => n === 0) || match.slice(1).map(Number).some((n) => !Number.isSafeInteger(n) || n > 2147483647)) {
              throw new Error(`VS Code extension version must be numeric major.minor.patch: ${version}`);
            }
          ' "$version"
          filename="sqlbraid-vscode-${version}.vsix"
          artifact="sqlbraid-vscode-${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Typecheck and build extension with bundled tooling
        run: |
          pnpm run typecheck
          pnpm run build
      - name: Package and validate exact VSIX
        env:
          PRE_RELEASE: ${{ inputs.pre_release }}
          VSIX_OUTPUT: ${{ runner.temp }}/${{ steps.identity.outputs.filename }}
        shell: bash
        run: |
          args=(node scripts/package-vscode.mjs --out "$VSIX_OUTPUT")
          if [[ "$PRE_RELEASE" == "true" ]]; then args+=(--pre-release); fi
          "${args[@]}"
      - name: Preserve VSIX for Marketplace upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: ${{ runner.temp }}/${{ steps.identity.outputs.filename }}
          if-no-files-found: error
          retention-days: 14
      - name: Record manual Marketplace handoff
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          ARTIFACT: ${{ steps.identity.outputs.artifact }}
          PRE_RELEASE: ${{ inputs.pre_release }}
        shell: bash
        run: |
          {
            echo "## VS Code Marketplace handoff"
            echo
            echo "Extension version: \`$VERSION\`"
            echo "GitHub artifact: \`$ARTIFACT\`"
            echo "Pre-release: \`$PRE_RELEASE\`"
            echo
            echo "Download this workflow artifact and upload the contained VSIX to the Microsoft VS Code Marketplace."
            echo "The same VSIX bytes are passed to the Open VSX publishing job below."
          } >> "$GITHUB_STEP_SUMMARY"

  open-vsx:
    name: Publish exact VSIX to Open VSX with OIDC
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: ${{ runner.temp }}/vsix
      - name: Publish to Open VSX using trusted publishing
        env:
          VSIX: ${{ runner.temp }}/vsix/${{ needs.package.outputs.filename }}
        shell: bash
        run: pnpm dlx "ovsx@${OVSX_VERSION}" publish "$VSIX" --trusted-publishing

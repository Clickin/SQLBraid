services:
  postgres:
    container_name: sqlbraid-perf-200
    image: postgres:17.6
    environment:
      POSTGRES_DB: sqlbraid_perf
      POSTGRES_USER: sqlbraid_perf
      POSTGRES_PASSWORD: sqlbraid_perf
      TZ: UTC
    ports:
      - "127.0.0.1:55432:5432"
    command: ["postgres", "-c", "timezone=UTC", "-c", "max_connections=50"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlbraid_perf -d sqlbraid_perf"]
      interval: 2s
      timeout: 2s
      retries: 30

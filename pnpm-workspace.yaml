packages:
  - packages/*
  - extensions/*
  - website

allowBuilds:
  '@vscode/vsce-sign': false
  better-sqlite3: true
  cpu-features: true
  esbuild: true
  keytar: false
  # Thin mode is pure JavaScript; the install script checks optional Thick binaries.
  oracledb: false
  protobufjs: true
  ssh2: true
  workerd: true
